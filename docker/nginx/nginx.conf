worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream
    upstream api_server {
        server api:3001;
    }

    # HTTP -> HTTPS redirect (production)
    server {
        listen 80;
        server_name api.civicstate.com;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name api.civicstate.com;

        ssl_certificate /etc/letsencrypt/live/api.civicstate.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.civicstate.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # CORS is primarily enforced by Express cors middleware.
        # Nginx adds headers for preflight when Express is unreachable.

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running agent requests
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Health check (no rate limit)
        location = /api/health {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
        }
    }
}
