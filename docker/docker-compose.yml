services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicstate
      POSTGRES_USER: civicstate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicstate"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    image: ghcr.io/${GITHUB_OWNER:-civicstate}/civicstate-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://civicstate:${POSTGRES_PASSWORD}@postgres:5432/civicstate
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN}
      NODE_ENV: production
      CORS_ORIGIN: https://civicstate.com
    ports:
      - "3001:3001"
    networks:
      - backend

  worker:
    image: ghcr.io/${GITHUB_OWNER:-civicstate}/civicstate-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://civicstate:${POSTGRES_PASSWORD}@postgres:5432/civicstate
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      NODE_ENV: production
      AGENT_MODEL_OVERRIDE: ${AGENT_MODEL_OVERRIDE:-}
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - api
    networks:
      - backend

volumes:
  pgdata:
  redisdata:
  certbot-etc:
  certbot-var:

networks:
  backend:
    driver: bridge
